<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="description" content="Restgeld - Daily Allowance Tracker" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <title>restgeld.</title>

  <style>
    /* Splash-Screen: erscheint sofort beim Laden (vor Vue-Mount), wird von
       main.ts entfernt sobald die App startklar ist. Verhindert den
       "unprofessionellen" Flicker von Halbzustand-Elementen. */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--splash-bg, #0a0a0c);
      color: var(--text-main, #f4f4f6);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: opacity 0.35s ease-out, visibility 0.35s;
    }
    #app-splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-brand {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
    }
    .splash-brand .dot {
      color: var(--accent-green, #22c55e);
    }
    .splash-sub {
      font-size: 0.85rem;
      color: var(--text-dim, #5c5c6e);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .splash-bar {
      width: 160px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }
    .splash-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent-green, #22c55e), transparent);
      background-size: 200% 100%;
      animation: splash-pulse 1s linear infinite;
    }
    @keyframes splash-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="splash-brand">restgeld<span class="dot">.</span></div>
    <div class="splash-sub">Daily Allowance</div>
    <div class="splash-bar" aria-hidden="true"><div class="splash-bar-inner"></div></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
