name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restgeld
          POSTGRES_PASSWORD: restgeld
          POSTGRES_DB: restgeld
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Dependencies
        run: go mod download
        working-directory: backend
      - name: Vet
        run: go vet ./...
        working-directory: backend
      - name: Unit Tests
        run: go test -short ./... -v -count=1 -coverprofile=coverage-unit.out
        working-directory: backend
      - name: Integration Tests
        run: go test -tags=integration ./... -v -count=1 -coverprofile=coverage-integration.out
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: restgeld
          DB_PASSWORD: restgeld
          DB_NAME: restgeld
      - name: Coverage
        run: |
          echo "### Unit Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage-unit.out >> $GITHUB_STEP_SUMMARY
          echo "### Integration Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage-integration.out >> $GITHUB_STEP_SUMMARY
        working-directory: backend
      - name: Build
        run: go build -o /dev/null .
        working-directory: backend
      - uses: codecov/codecov-action@v5
        if: success()
        with:
          files: backend/coverage-unit.out,backend/coverage-integration.out
          flags: backend
          fail_ci_if_error: false
