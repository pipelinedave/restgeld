name: Docker

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', 'services/auth-service/**', 'services/billing-service/**', 'services/monitoring-service/**']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'frontend/**', 'services/auth-service/**', 'services/billing-service/**', 'services/monitoring-service/**']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: restgeld-backend
            context: backend/
          - name: restgeld-auth-service
            context: services/auth-service/
          - name: restgeld-billing-service
            context: services/billing-service/
          - name: restgeld-monitoring-service
            context: services/monitoring-service/
          - name: restgeld-frontend
            context: frontend/
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{sha}}-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
