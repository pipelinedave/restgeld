services:
  db:
    image: postgres:16-alpine
    container_name: restgeld-db
    environment:
      POSTGRES_USER: restgeld
      POSTGRES_PASSWORD: restgeld
      POSTGRES_DB: restgeld_core
      POSTGRES_MULTIPLE_DATABASES: restgeld_core,restgeld_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restgeld -d restgeld_core"]
      interval: 3s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: restgeld-mailpit
    ports:
      - "8025:8025" # Mailpit Web UI
      - "1025:1025" # SMTP Port

  restgeld-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restgeld-backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: restgeld
      DB_PASSWORD: restgeld
      DB_NAME: restgeld_core
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: restgeld-auth-service
    environment:
      PORT: "8081"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: restgeld
      DB_PASSWORD: restgeld
      DB_NAME: restgeld_auth
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: restgeld-billing-service
    environment:
      PORT: "8082"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: restgeld
      DB_PASSWORD: restgeld
      DB_NAME: restgeld_auth
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: restgeld-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://restgeld-backend:8080
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - restgeld-backend

volumes:
  postgres_data:
