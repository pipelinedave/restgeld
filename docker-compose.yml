services:
  db:
    image: postgres:16-alpine
    container_name: restgeld-db
    environment:
      POSTGRES_USER: restgeld
      POSTGRES_PASSWORD: restgeld
      POSTGRES_DB: restgeld
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restgeld -d restgeld"]
      interval: 3s
      timeout: 3s
      retries: 5

  restgeld-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restgeld-backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: restgeld
      DB_PASSWORD: restgeld
      DB_NAME: restgeld
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restgeld-frontend
    ports:
      - "3000:80"
    depends_on:
      - restgeld-backend

volumes:
  postgres_data:
